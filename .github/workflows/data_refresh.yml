name: Refresh football data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch multi-season historical competition data
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
          FOOTBALL_DATA_COMPETITION: PL
          FOOTBALL_DATA_SEASONS: '2021,2022,2023,2024,2025'
        run: python -m src.ingest_multi_season
      - name: Run walk-forward backtest
        run: python -m src.run_backtest
      - name: Save data and backtest report
        uses: actions/upload-artifact@v4
        with:
          name: football-data-backtest
          path: |
            data/raw/matches.json
            data/reports/backtest.json
          retention-days: 7
