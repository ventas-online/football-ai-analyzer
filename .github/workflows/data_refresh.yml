name: Refresh football data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch current competition data
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
          FOOTBALL_DATA_COMPETITION: PL
        run: python -m src.ingest_football_data
      - name: Save fetched data as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: football-data-refresh
          path: data/raw/matches.json
          retention-days: 7
